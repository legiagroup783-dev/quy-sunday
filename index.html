<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quỹ Sunday Walkers</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#16a34a">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quỹ Sunday Walkers">

  <style>
    :root{ --brand:#16a34a; --brand-d:#0c7a38; }
    html,body{margin:0;height:100%;background:var(--brand);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #app{border:0;width:100%;height:100%;display:block;background:#f3f6f2}
    #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;text-align:center;padding:24px}
    #load img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    #load .t{font-size:17px;font-weight:700}
    #load .s{font-size:13px;opacity:.9}
    .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    #fallback{display:none;margin-top:6px}
    #fallback a{display:inline-block;background:#fff;color:var(--brand-d);font-weight:800;text-decoration:none;padding:11px 20px;border-radius:12px;font-size:15px}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  </style>
</head>
<body>
  <div id="load">
    <img src="icon-192.png" alt="">
    <div class="t">Quỹ Bóng Đá · FC Sunday Walkers</div>
    <div class="spin" id="spin"></div>
    <div class="s">Đang mở ứng dụng…</div>
    <div id="fallback">
      <div class="s" style="margin-bottom:8px">Mạng chậm? Bấm nút dưới để mở:</div>
      <a id="openLink" href="#">▶ Mở ứng dụng</a>
    </div>
  </div>

  <!-- 👉 DÁN LINK WEB APP V2 (FC Sunday Walkers) VÀO 2 CHỖ "PASTE_V2..." -->
  <iframe id="app" title="Quỹ Sunday Walkers" src="https://script.google.com/macros/s/AKfycbzOlVznBIaP42K4OyGskA8WLDRzb4RjUEsh_hV1f81eNiFNbz9hFBST78AmHRy0cQFTKw/exec"
          allow="clipboard-write; camera"
          onload="document.getElementById('load').style.display='none'"></iframe>

  <script>
    var URL_APP = "https://script.google.com/macros/s/AKfycbzOlVznBIaP42K4OyGskA8WLDRzb4RjUEsh_hV1f81eNiFNbz9hFBST78AmHRy0cQFTKw/exec";
    document.getElementById('openLink').href = URL_APP;
    setTimeout(function(){
      var load = document.getElementById('load');
      if (load && load.style.display !== 'none') {
        document.getElementById('spin').style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
      }
    }, 7000);
  </script>
</body>
</html>
